<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
    <title>Contact form | Frontend Mentor</title>
  </head>
  <body>
    <main>
      <dialog class="message" id="toast">
        <p class="message__title">
          <span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
              <!--!Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
              <path
                fill="#ffffff"
                d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"
              /></svg></span
          >Message Sent!
        </p>
        <p>Thanks for completing the form, we'll be in touch soon!</p>
      </dialog>
      <div class="container">
        <form id="form">
          <h2>Contact Us</h2>
          <div class="two-column">
            <label for="first-name">
              <span>First Name <span class="required">*</span></span>
              <input required type="text" id="first-name" />
              <span class="form__error" aria-hidden="true" id="first-name-error"
                >This field is required</span
              >
            </label>
            <label for="last-name">
              <span>Last Name <span class="required">*</span></span>
              <input required type="text" id="last-name" />
              <span class="form__error" aria-hidden="true" id="last-name-error"
                >This field is required</span
              >
            </label>
          </div>
          <label for="email">
            <span>Email Address <span class="required">*</span></span>
            <input required type="email" id="email" />
            <span class="form__error" aria-hidden="true" id="email-error"
              >Please enter a valid email address</span
            >
          </label>
          <div>
            <p class="form__label">
              Query Type <span class="required">*</span>
            </p>
            <fieldset class="two-column form__radios">
              <label for="general">
                <span class="radio">
                  <span></span>
                </span>
                <input
                  required
                  type="radio"
                  id="general"
                  name="query"
                  value="general"
                />
                General Enquiry
              </label>
              <label for="support">
                <span class="radio">
                  <span></span>
                </span>
                <input type="radio" id="support" name="query" value="support" />
                Support Request
              </label>
            </fieldset>
            <span class="form__error" aria-hidden="true" id="query-error"
              >Please enter a query type</span
            >
          </div>
          <label for="message">
            <span>Message <span class="required">*</span></span>
            <textarea required id="message"></textarea>
            <span class="form__error" aria-hidden="true" id="message-error"
              >This field is required</span
            >
          </label>
          <label for="consent">
            <span class="checkbox">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                <!--!Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                <path
                  fill="#ffffff"
                  d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"
                />
              </svg>
            </span>
            <input required type="checkbox" id="consent" />
            <span>
              I consent to being contacted by the team
              <span class="required">*</span>
            </span>
            <span class="form__error" id="consent-error"
              >To submit this form, please consent to being contacted</span
            >
          </label>
          <button id="submit">Submit</button>
        </form>
      </div>
    </main>
  </body>
</html>
