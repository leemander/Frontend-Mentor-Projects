<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Contact form | Frontend Mentor</title>
  </head>
  <body>
    <main>
      <div class="container">
        <form>
          <h2>Contact Us</h2>
          <div class="two-column">
            <label for="first-name">
              <span>First Name <span class="required">*</span></span>
              <input type="text" id="first-name" />
              <span class="form__error" aria-hidden="true" id="first-name-error"
                >This field is required</span
              >
            </label>
            <label for="last-name">
              <span>Last Name <span class="required">*</span></span>
              <input type="text" id="last-name" />
              <span class="form__error" aria-hidden="true" id="last-name-error"
                >This field is required</span
              >
            </label>
          </div>
          <label for="email">
            <span>Email Address <span class="required">*</span></span>
            <input type="email" id="email" />
            <span class="form__error" aria-hidden="true" id="email-error"
              >Please enter a valid email address</span
            >
          </label>
          <div>
            <p class="form__label">
              Query Type <span class="required">*</span>
            </p>
            <div class="two-column">
              <label for="general">
                <span class="radio">
                  <span></span>
                </span>
                <input type="radio" id="general" name="query" value="general" />
                <span>General Enquiry</span>
              </label>
              <label for="support">
                <span class="radio">
                  <span></span>
                </span>
                <input type="radio" id="support" name="query" value="support" />
                <span>Support Request</span>
              </label>
            </div>
            <span class="form__error" aria-hidden="true" id="fname-error"
              >Please enter a query type</span
            >
          </div>
          <label for="message">
            <span>Message <span class="required">*</span></span>
            <textarea id="message"></textarea>
            <span class="form__error" aria-hidden="true" id="message-error"
              >This field is required</span
            >
          </label>
          <label for="consent">
            <input type="checkbox" id="consent" />
            <span>
              I consent to being contacted by the team
              <span class="required">*</span>
            </span>
            <span class="form__error" id="consent-error"
              >To submit this form, please consent to being contacted</span
            >
          </label>
          <button>Submit</button>
        </form>
      </div>
    </main>
  </body>
</html>
